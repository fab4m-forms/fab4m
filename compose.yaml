services:
  pi:
    image: codeberg.org/fabsor/pi-image:latest
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Persist pi config/sessions on the host (override with PI_HOME_DIR).
      - ${PI_HOME_DIR:-./.pi-home}:/home/pi
    environment:
      # Helpful for some tools expecting a terminal.
      TERM: xterm-256color
    stdin_open: true
    tty: true
    command: pi
